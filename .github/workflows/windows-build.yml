name: Windows EXE Build & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 for Electron build compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web SPA
        run: npm run build

      - name: Build Windows Executable (NSIS & Portable)
        run: npx electron-builder --win --publish never

      - name: List Generated Executables
        shell: bash
        run: |
          echo "=== Generated Windows Executable Binaries ==="
          ls -lh release/*.exe || ls -lh release/

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flick-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
